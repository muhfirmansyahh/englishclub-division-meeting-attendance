<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Club Aspire — Management System</title>
<style>
:root{
  --sidebar:#14284b; --btn:#1f4fbf; --btn-fg:#ffffff; --accent:#e3a72f; --accent-fg:#16213a;
  --bg:#f3f6fb; --surface:#ffffff; --text:#16213a; --muted:#5d6b86; --line:#dde4f0; --soft:#eef2fa;
  --st-hadir:#1f8a5b; --st-alfa:#c53030; --st-izin:#d9822b; --st-sakit:#2b6cb0; --st-belum:#8a94a6;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06);
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-mode="dark"]{
  --bg:#0f1522; --surface:#172033; --text:#e7ecf5; --muted:#93a0ba; --line:#26324a; --soft:#1d2840;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}
html[data-card="outline"]{--shadow:none}
html[data-card="outline"] .card,html[data-card="outline"] .stat{border-width:1.5px}
html[data-card="flat"]{--shadow:none}
html[data-card="flat"] .card,html[data-card="flat"] .stat{border-color:transparent;background:var(--soft)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);font-size:14.5px;line-height:1.5;color:var(--text);background:var(--bg);-webkit-text-size-adjust:100%;overflow-x:hidden}
h1,h2,h3,h4{margin:0;line-height:1.25}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--btn)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12.5px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===== Shell ===== */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--sidebar);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:50}
.brand{display:flex;gap:12px;align-items:center;padding:20px 18px 14px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:800;display:grid;place-items:center;overflow:hidden;flex:none;letter-spacing:.02em}
.logo img{width:100%;height:100%;object-fit:cover}
.brand b{display:block;font-size:15px;line-height:1.2}
.brand small{opacity:.7;font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px;padding:8px 10px;flex:1}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.78);text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.active{background:rgba(255,255,255,.15);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.side-foot{padding:14px 18px;font-size:11.5px;opacity:.6}
.backdrop{display:none}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar h1{font-size:18px;white-space:nowrap}
.topbar .menu-btn{display:none}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center}
.gsearch{position:relative;flex:1;max-width:380px;margin-left:auto}
.gsearch input{width:100%;min-height:40px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg)}
.gs-results{position:absolute;top:46px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:340px;overflow:auto;padding:6px;z-index:40}
.gs-item{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px}
.gs-item:hover{background:var(--soft)}
.gs-item small{color:var(--muted)}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;font-size:12px;color:var(--muted);white-space:nowrap}
.clock b{font-size:15px;color:var(--text);font-variant-numeric:tabular-nums}
.profile{display:flex;align-items:center;gap:10px}
.sync{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.sync[data-s="online"]{color:var(--st-hadir)}
.sync[data-s="offline"],.sync[data-s="connecting"]{color:var(--st-izin)}
.sync[data-s="error"]{color:var(--st-alfa)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--btn);color:var(--btn-fg);display:grid;place-items:center;font-weight:700}
.content{padding:24px;max-width:1240px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.content:focus{outline:none}

/* ===== Komponen ===== */
.page-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.page-head h2{font-size:22px}
.page-head p{color:var(--muted);margin-top:2px}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:16px;margin-bottom:12px}
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-head h3{margin:0}
.grid{display:grid;gap:16px}
.g-stats{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.stat{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.stat .ic{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--btn) 14%,transparent);color:var(--btn);display:grid;place-items:center;flex:none}
.stat b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12.5px}
.stat small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.hero{border-radius:var(--radius);padding:26px;color:#fff;background:linear-gradient(120deg,var(--sidebar),var(--btn));background-size:cover;background-position:center;position:relative;overflow:hidden;min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.hero.has-img::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.6),rgba(0,0,0,.15))}
.hero>*{position:relative}
.hero h2{font-size:22px}
.hero p{opacity:.85;max-width:60ch}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:10px;border:1px solid var(--btn);background:var(--btn);color:var(--btn-fg);font-weight:600;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{background:var(--soft);filter:none}
.btn.danger{background:var(--st-alfa);border-color:var(--st-alfa);color:#fff}
.btn.sm{min-height:34px;padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.icon{padding:6px;width:34px;min-height:34px}

label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;letter-spacing:.03em}
.field{display:flex;flex-direction:column;min-width:0}
.field input,.field select,.field textarea,.input{width:100%;min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.field input[type="color"]{padding:2px;height:42px}
.field input[type="checkbox"]{width:auto;min-height:0}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.err{color:var(--st-alfa);font-size:13px;margin-top:6px;min-height:1px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.toolbar .field{min-width:150px;flex:1 1 150px}
.toolbar .field.grow{flex:2 1 220px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--soft);white-space:nowrap}
th .sort{border:0;background:transparent;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;padding:0;display:inline-flex;gap:4px;align-items:center}
th .sort:hover{color:var(--text)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--btn) 5%,transparent)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.act{white-space:nowrap;text-align:right}
td.act .btn+.btn{margin-left:6px}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--muted);white-space:nowrap}
.badge.demo{background:color-mix(in srgb,var(--accent) 25%,transparent);color:var(--text);margin-left:6px}
.badge.hadir{background:color-mix(in srgb,var(--st-hadir) 16%,transparent);color:var(--st-hadir)}
.badge.alfa{background:color-mix(in srgb,var(--st-alfa) 16%,transparent);color:var(--st-alfa)}
.badge.izin{background:color-mix(in srgb,var(--st-izin) 18%,transparent);color:var(--st-izin)}
.badge.sakit{background:color-mix(in srgb,var(--st-sakit) 16%,transparent);color:var(--st-sakit)}
.badge.belum{background:color-mix(in srgb,var(--st-belum) 18%,transparent);color:var(--st-belum)}
.badge.warn{background:color-mix(in srgb,var(--st-izin) 18%,transparent);color:var(--st-izin)}
.st-select{--c:var(--st-belum);min-height:38px;padding:6px 10px;border-radius:10px;font-weight:600;color:var(--c);border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface));min-width:130px}
.st-select[data-status="hadir"]{--c:var(--st-hadir)}
.st-select[data-status="alfa"]{--c:var(--st-alfa)}
.st-select[data-status="izin"]{--c:var(--st-izin)}
.st-select[data-status="sakit"]{--c:var(--st-sakit)}
.st-select option{color:var(--text);background:var(--surface)}
.note-input{width:100%;min-width:160px;min-height:38px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.note-input:disabled{opacity:.5}
.bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--st-hadir);border-radius:999px}
.bar-cell{display:flex;align-items:center;gap:8px}
.bar-cell .bar{flex:1}
.bar-cell span{min-width:48px;text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px}
.chip b{font-variant-numeric:tabular-nums}
.chip.on{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
button.chip{cursor:pointer}
.empty{text-align:center;padding:34px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .big{width:54px;height:54px;border-radius:16px;background:var(--soft);display:grid;place-items:center;color:var(--btn)}
.empty .big svg{width:26px;height:26px}
.empty b{color:var(--text);font-size:15px}
.save-ind{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.save-ind.ok{color:var(--st-hadir)}
.list{display:flex;flex-direction:column}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .t{min-width:0;overflow-wrap:anywhere}
.list-item .s{font-size:12.5px;color:var(--muted)}
.callout{padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--accent) 16%,transparent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);font-size:13.5px}

/* ===== Grafik ===== */
.chart svg{width:100%;height:auto;display:block}
.svg-grid{stroke:var(--line);stroke-width:1}
.svg-t{fill:var(--muted);font-size:11px;font-family:var(--font)}
.svg-v{fill:var(--text);font-size:11px;font-weight:600;font-family:var(--font)}
.svg-bar{fill:var(--btn)}
.donut-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:18px;justify-content:center}
.donut-wrap svg{width:170px;height:170px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}

/* ===== Podium ===== */
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.pod{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--surface);text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow)}
.pod .medal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#2b2208;font-size:18px;background:#e3b13c}
.pod.r2 .medal{background:#c3cad6}
.pod.r3 .medal{background:#d39a6a}
.pod b{font-size:16px;overflow-wrap:anywhere}
.pod .val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--btn)}

/* ===== Divisi / board ===== */
.div-card{display:flex;flex-direction:column;gap:12px}
.div-card h3{margin:0;font-size:17px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kv div{background:var(--soft);border-radius:10px;padding:8px 4px}
.kv b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.kv span{font-size:11.5px;color:var(--muted)}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.theme-opt{border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:10px;text-align:left;display:flex;flex-direction:column;gap:8px}
.theme-opt.on{border-color:var(--btn)}
.swatch{display:flex;height:22px;border-radius:6px;overflow:hidden}
.swatch i{flex:1}
.preview{border:1px dashed var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:90px 1fr;gap:14px;background:var(--bg)}
.preview .ps{background:var(--sidebar);border-radius:10px;min-height:120px}
.preview .pc{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.ann{border-left:4px solid var(--accent);padding:6px 0 6px 12px}
.ann+.ann{margin-top:12px}
.ann b{display:block}

/* ===== Login & publik ===== */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,var(--sidebar),color-mix(in srgb,var(--btn) 70%,#000))}
.login-card{width:100%;max-width:420px;background:var(--surface);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.login-card .logo{width:56px;height:56px;font-size:20px;margin:0 auto}
.login-card h1{font-size:20px;text-align:center}
.pw-row{position:relative}
.pw-row input{padding-right:96px}
.pw-row button{position:absolute;right:6px;top:6px;min-height:30px;border:0;background:transparent;color:var(--btn);font-weight:600;font-size:13px;border-radius:8px;padding:0 10px}
.public-top{display:flex;align-items:center;gap:14px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.public-top .logo{width:38px;height:38px;font-size:14px}
.public-top b{font-size:16px}
.public-top .sp{margin-left:auto}

/* ===== Modal & toast ===== */
.modal-back{position:fixed;inset:0;background:rgba(10,16,30,.55);display:grid;place-items:center;padding:16px;z-index:100;overflow:auto}
.modal{background:var(--surface);color:var(--text);border-radius:16px;width:100%;max-width:520px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.modal.wide{max-width:860px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:17px}
.modal-body{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
.modal-msg{line-height:1.6}
.modal-msg ul{margin:8px 0 0;padding-left:20px}
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:200;max-width:min(380px,calc(100vw - 32px))}
.toast{padding:12px 16px;border-radius:12px;background:var(--text);color:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:500;border-left:5px solid var(--st-hadir);animation:tin .2s ease-out}
.toast.error{border-left-color:var(--st-alfa)}
.toast.info{border-left-color:var(--st-sakit)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}

/* ===== Responsif ===== */
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:272px;transform:translateX(-100%);transition:transform .22s ease}
  .app.open .sidebar{transform:none}
  .app.open .backdrop{display:block;position:fixed;inset:0;background:rgba(10,16,30,.5);z-index:45}
  .topbar .menu-btn{display:grid}
  .topbar{padding:10px 14px;gap:10px}
  .clock{display:none}
  .content{padding:16px}
}
@media (max-width:640px){
  .topbar h1{font-size:16px}
  .gsearch{max-width:none}
  .pname{display:none}
  .page-head h2{font-size:19px}
  .preview{grid-template-columns:50px 1fr}
  .public-top{padding:10px 14px;flex-wrap:wrap}
  .btn{min-height:42px}
  .modal-foot .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){.sidebar{transition:none}}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="loginView" class="hidden">
  <div class="login-wrap">
    <form class="login-card" id="loginForm" data-submit="login" novalidate>
      <div class="logo" id="loginLogo"></div>
      <div style="text-align:center">
        <h1 id="loginTitle">English Club Aspire</h1>
        <p class="muted small">Admin Management System</p>
      </div>
      <div class="field">
        <label for="loginUser">Username</label>
        <input id="loginUser" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <div class="field">
        <label for="loginPass">Password</label>
        <div class="pw-row">
          <input id="loginPass" type="password" autocomplete="current-password">
          <button type="button" id="pwToggle" data-action="togglePw" aria-label="Tampilkan atau sembunyikan password">Tampilkan</button>
        </div>
      </div>
      <div class="err" id="loginErr" role="alert"></div>
      <button class="btn" type="submit">Masuk</button>
      <button class="btn ghost" type="button" data-action="nav" data-to="board">Lihat Member Performance Board</button>
      <p class="hint" style="text-align:center">Login ini hanya pembatas tampilan di browser, bukan keamanan sungguhan. Untuk data sensitif gunakan backend dengan autentikasi server.</p>
    </form>
  </div>
</div>

<!-- ===== HALAMAN PUBLIK (BOARD) ===== -->
<div id="publicView" class="hidden"></div>

<!-- ===== APLIKASI ADMIN ===== -->
<div id="appView" class="hidden">
  <div class="app" id="appShell">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
      <div class="brand">
        <div class="logo" id="brandLogo"></div>
        <div><b id="brandOrg"></b><small>Admin Management</small></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">Data tersimpan di browser &amp; disinkronkan online.</div>
    </aside>
    <div class="backdrop" data-action="closeDrawer"></div>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" data-action="openDrawer" aria-label="Buka menu" id="menuBtn"></button>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="gsearch">

  if (!S.attendance || typeof S.attendance !== 'object' || Array.isArray(S.attendance)) S.attendance = {};

  S.settings.custom = Object.assign(defaultSettings().custom, st.custom || {});
  if (!Array.isArray(S.settings.edConfig) || !S.settings.edConfig.length) S.settings.edConfig = defaultSettings().edConfig;
  if (!THEMES[S.settings.theme] && S.settings.theme !== 'custom') S.settings.theme = 'navy';

/* ---------- Toast & Modal ---------- */
function toast(msg, type, ms) {
  const el = document.createElement('div');
  el.className = 'toast' + (type && type !== 'success' ? ' ' + type : '');
  el.setAttribute('role', type === 'error' ? 'alert' : 'status');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), ms || 3200);
}
const modals = [];
function openModal(o) {
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = '<div class="modal' + (o.wide ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(o.title) + '" tabindex="-1">' +
    '<div class="modal-head"><h3>' + esc(o.title) + '</h3><button class="icon-btn" type="button" data-modal-close aria-label="Tutup">' + icon('x') + '</button></div>' +
    '<div class="modal-body">' + o.body + '</div>' + (o.footer ? '<div class="modal-foot">' + o.footer + '</div>' : '') + '</div>';
  const prev = document.activeElement;
  let closed = false;
  const m = {
    el: back,
    close(result) {
      if (closed) return;
      closed = true;
      const i = modals.indexOf(m); if (i >= 0) modals.splice(i, 1);
      back.remove();
      if (prev && prev.focus && document.contains(prev)) { try { prev.focus(); } catch (e) {} }
      if (o.onClose) o.onClose(result);
    }
  };
  back.addEventListener('mousedown', e => { if (e.target === back) m.close(false); });
  back.addEventListener('click', e => {
    if (e.target.closest('[data-modal-close]')) { m.close(false); return; }
    const r = e.target.closest('[data-modal-result]');
    if (r) m.close(r.dataset.modalResult === 'true');
  });
  $('#modalRoot').appendChild(back);
  modals.push(m);
  const f = back.querySelector('.modal-body input:not([type=hidden]),.modal-body select,.modal-body textarea') || back.querySelector('.modal-foot .btn:last-child') || back.querySelector('.modal');
  if (f && f.focus) f.focus();
  return m;
}
function closeTopModal(result) { const m = modals[modals.length - 1]; if (m) m.close(result); }
function confirmDialog(o) {
  return new Promise(res => {
    openModal({
      title: o.title, body: '<div class="modal-msg">' + o.message + '</div>',

      onClose: res

}

  document.body.appendChild(a); a.click(); a.remove();

}

}

/* ---------- Data helpers ---------- */
const divById = id => S.divisions.find(d => d.id === id);

function records() {
  const out = [];
  Object.keys(S.attendance).forEach(mid => {
    const meet = meetById(mid); if (!meet) return;
    const recs = S.attendance[mid] || {};
    Object.keys(recs).forEach(memId => {
      const mem = memById(memId); const r = recs[memId];
      if (!mem || !r || STATUS_LIST.indexOf(r.status) < 0) return;
      out.push({ meeting: meet, member: mem, status: r.status, note: r.note || '', at: r.updatedAt || '' });
    });
  });
  return out;
}
function inPeriod(date, year, month) {
  if (!date) return false;
  const p = date.split('-').map(Number);
  if (year !== 'all' && p[0] !== Number(year)) return false;
  if (month !== 'all' && p[1] !== Number(month)) return false;
  return true;
}
function aggregate(recs) {
  const a = { hadir: 0, alfa: 0, izin: 0, sakit: 0, total: 0, pct: 0 };
  recs.forEach(r => { if (a[r.status] !== undefined) { a[r.status]++; a.total++; } });
  a.pct = a.total ? Math.round(a.hadir / a.total * 1000) / 10 : 0;
  return a;
}
/* Rekap per anggota. Status "belum diisi" tidak pernah dihitung (bukan Alfa). */
function recapRows(f) {
  f = Object.assign({ year: 'all', month: 'all', div: 'all', member: 'all', q: '' }, f || {});
  let recs = records().filter(r => inPeriod(r.meeting.date, f.year, f.month));
  if (f.div !== 'all') recs = recs.filter(r => r.meeting.divisionId === f.div);
  const withRec = new Set(recs.map(r => r.member.id));
  let pool = S.members.slice();
  if (f.member !== 'all') pool = pool.filter(m => m.id === f.member);
  if (f.div !== 'all') pool = pool.filter(m => m.divisionId === f.div || withRec.has(m.id));
  const q = normName(f.q);
  if (q) pool = pool.filter(m => normName(m.name).indexOf(q) >= 0);
  const by = {};
  recs.forEach(r => { (by[r.member.id] = by[r.member.id] || []).push(r); });
  return pool.map(m => {
    const a = aggregate(by[m.id] || []);
    return { id: m.id, name: m.name, divisionId: m.divisionId, divisionName: divName(m.divisionId), demo: m.demo, hadir: a.hadir, alfa: a.alfa, izin: a.izin, sakit: a.sakit, total: a.total, pct: a.pct };
  });
}
/* Peringkat kompetisi: nilai sama -> peringkat sama. */
function assignRanks(rows, cmp) {
  rows.sort((a, b) => cmp(a, b) || byName(a, b));
  rows.forEach((r, i) => { r.rank = (i > 0 && cmp(rows[i - 1], r) === 0) ? rows[i - 1].rank : i + 1; });
  return rows;
}
const cmpAttendance = (a, b) => (b.pct - a.pct) || (b.hadir - a.hadir);

/* =====================================================================
   GRAFIK (SVG)
   ===================================================================== */
function barChart(items) {
  const W = 560, H = 220, L = 34, R = 8, T = 18, B = 30;
  const iw = W - L - R, ih = H - T - B, n = items.length || 1, slot = iw / n, bw = Math.min(46, slot * 0.6);
  let g = '';
  [0, 50, 100].forEach(v => {
    const y = T + ih - ih * v / 100;
    g += '<line class="svg-grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/><text class="svg-t" x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + v + '%</text>';
  });
  items.forEach((it, i) => {
    const cx = L + slot * i + slot / 2;
    g += '<text class="svg-t" x="' + cx + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(it.label) + '</text>';
    if (it.value == null) { g += '<text class="svg-t" x="' + cx + '" y="' + (T + ih - 6) + '" text-anchor="middle">–</text>'; return; }
    const h = Math.max(2, ih * it.value / 100), y = T + ih - h;
    g += '<rect class="svg-bar" x="' + (cx - bw / 2) + '" y="' + y + '" width="' + bw + '" height="' + h + '" rx="5"/>' +
      '<text class="svg-v" x="' + cx + '" y="' + (y - 5) + '" text-anchor="middle">' + fmtPct(it.value) + '</text>';
  });
  return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Grafik kehadiran bulanan">' + g + '</svg></div>';
}
function donutChart(agg) {
  const C = 2 * Math.PI * 54;
  let off = 0, segs = '';
  if (agg.total) {
    STATUS_LIST.forEach(s => {
      const len = C * agg[s] / agg.total;
      if (len > 0) segs += '<circle cx="70" cy="70" r="54" fill="none" stroke="var(--st-' + s + ')" stroke-width="22" stroke-dasharray="' + len + ' ' + (C - len) + '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 70 70)"/>';
      off += len;
    });
  } else segs = '<circle cx="70" cy="70" r="54" fill="none" stroke="var(--line)" stroke-width="22"/>';
  const svg = '<svg viewBox="0 0 140 140" role="img" aria-label="Perbandingan status kehadiran">' + segs +
    '<text x="70" y="68" text-anchor="middle" class="svg-v" style="font-size:20px">' + agg.total + '</text><text x="70" y="86" text-anchor="middle" class="svg-t">catatan</text></svg>';
  const legend = '<div class="legend">' + STATUS_LIST.map(s => '<div><i style="background:var(--st-' + s + ')"></i>' + STATUS_LABEL[s] + ': <b>' + agg[s] + '</b>' + (agg.total ? ' (' + Math.round(agg[s] / agg.total * 100) + '%)' : '') + '</div>').join('') + '</div>';
  return '<div class="donut-wrap chart">' + svg + legend + '</div>';
}
function monthlySeries(count) {
  const now = new Date(), out = [], recs = records();
  for (let i = count - 1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = d.getFullYear() + '-' + pad(d.getMonth() + 1);
    const a = aggregate(recs.filter(r => r.meeting.date.slice(0, 7) === key));
    out.push({ label: MONTHS_S[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2), value: a.total ? a.pct : null, total: a.total });
  }
  return out;
}
function divisionSummary(year, month) {
  const recs = records().filter(r => inPeriod(r.meeting.date, year || 'all', month || 'all'));
  return S.divisions.map(d => {
    const a = aggregate(recs.filter(r => r.meeting.divisionId === d.id));
    return { id: d.id, name: d.name, members: membersOf(d.id).length, meetings: S.meetings.filter(m => m.divisionId === d.id && inPeriod(m.date, year || 'all', month || 'all')).length, agg: a };
  });
}
function barCell(p, has) {
  return has ? '<div class="bar-cell"><div class="bar"><i style="width:' + Math.min(100, p) + '%"></i></div><span>' + fmtPct(p) + '</span></div>' : '<span class="muted">Belum ada data</span>';
}

}

/* =====================================================================

   ===================================================================== */
function attMeetingsFor(div) { return S.meetings.filter(m => m.divisionId === div).sort((a, b) => b.date.localeCompare(a.date)); }
function pickDefaultMeeting(div) {
  const list = attMeetingsFor(div), t = todayStr();
  return ((list.find(m => m.date <= t) || list[0]) || {}).id || '';
}
function attSummaryHTML(meet, list) {
  const filled = list.filter(m => getRec(meet.id, m.id)).length, a = aggregate(list.map(m => ({ status: (getRec(meet.id, m.id) || {}).status })).filter(r => r.status));
  return '<span class="chip"><b>' + filled + '</b> sudah diabsen</span><span class="chip"><b>' + (list.length - filled) + '</b> belum diabsen</span>' +
    STATUS_LIST.map(s => '<span class="chip"><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--st-' + s + ')"></i> ' + STATUS_LABEL[s] + ' <b>' + a[s] + '</b></span>').join('');
}
function attBody() {
  const f = UI.att;

    '<div class="row-actions"><span class="save-ind" id="saveInd">Perubahan disimpan otomatis</span><button class="btn sm" type="button" data-action="attSave">Simpan</button><button class="btn ghost sm" type="button" data-action="attClear">Kosongkan semua</button></div></div>' +
    (future ? '<div class="callout" style="margin-bottom:12px">Pertemuan ini dijadwalkan pada ' + fmtDate(meet.date) + ' dan belum berlangsung.</div>' : '') +

        '<td><input class="note-input" maxlength="120" data-change="attNote" data-m="' + esc(meet.id) + '" data-p="' + esc(m.id) + '" value="' + esc(r.note || '') + '" placeholder="Keterangan (opsional)" aria-label="Keterangan ' + esc(m.name) + '"' + (st ? '' : ' disabled') + '></td>' +

function imageToDataURL(file, max, type, q) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) { rej(new Error('File harus berupa gambar.')); return; }
    if (file.size > 8 * 1024 * 1024) { rej(new Error('Ukuran gambar maksimal 8 MB.')); return; }
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('Gagal membaca file.'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('Gambar tidak dapat dibuka.'));
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(img.width * k)); cv.height = Math.max(1, Math.round(img.height * k));
        const cx = cv.getContext('2d');
        if (type === 'image/jpeg') { cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, cv.width, cv.height); }
        cx.drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL(type, q));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function handleImage(el, key, max, type, q) {
  const f = el.files && el.files[0]; el.value = '';
  if (!f) return;
  imageToDataURL(f, max, type, q).then(url => {
    S.settings[key] = url;
    if (persist('settings')) toast('Gambar disimpan.');
    applyTheme(); rerender();
  }, err => toast(err.message, 'error'));
}

/* ---------- Backup / restore ---------- */
A.exportJson = () => {

A.exportAllCsv = () => exportRecapCSV({ year: 'all', month: 'all', div: 'all', member: 'all', q: '' }, 'rekap-kehadiran-keseluruhan.csv');
A.importPick = () => $('#importFile').click();
function validateBackup(d) {
  if (!d || typeof d !== 'object' || Array.isArray(d)) return 'Isi file bukan data backup yang valid.';
  const arr = ['members', 'divisions', 'meetings', 'englishDayScores', 'announcements'];
  for (const k of arr) if (!Array.isArray(d[k])) return 'Bagian "' + k + '" tidak ditemukan atau bukan daftar.';
  if (!d.attendance || typeof d.attendance !== 'object' || Array.isArray(d.attendance)) return 'Bagian "attendance" tidak valid.';
  if (!d.settings || typeof d.settings !== 'object') return 'Bagian "settings" tidak valid.';
  if (d.members.some(m => !m || typeof m.id !== 'string' || typeof m.name !== 'string')) return 'Data anggota tidak valid.';
  if (d.divisions.some(m => !m || typeof m.id !== 'string' || typeof m.name !== 'string')) return 'Data divisi tidak valid.';
  if (d.meetings.some(m => !m || typeof m.id !== 'string' || typeof m.title !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(m.date || ''))) return 'Data pertemuan tidak valid.';
  for (const mid of Object.keys(d.attendance)) {
    const recs = d.attendance[mid];
    if (!recs || typeof recs !== 'object') return 'Data absensi tidak valid.';
    for (const pid of Object.keys(recs)) if (!recs[pid] || STATUS_LIST.indexOf(recs[pid].status) < 0) return 'Ada status absensi yang tidak dikenal.';
  }
  return '';
}
CH.importJson = el => {
  const f = el.files && el.files[0]; el.value = '';
  if (!f) return;
  if (f.size > 20 * 1024 * 1024) { toast('File terlalu besar.', 'error'); return; }
  const fr = new FileReader();
  fr.onerror = () => toast('Gagal membaca file.', 'error');
  fr.onload = async () => {
    let d;
    try { d = JSON.parse(fr.result); } catch (e) { toast('File bukan JSON yang valid.', 'error'); return; }
    const bad = validateBackup(d);
    if (bad) { toast(bad, 'error', 5500); return; }
    const ok = await confirmDialog({
      title: 'Import data backup?', danger: true, confirmText: 'Ganti data sekarang',
      message: 'File berisi <b>' + d.members.length + '</b> anggota, <b>' + d.divisions.length + '</b> divisi, <b>' + d.meetings.length + '</b> pertemuan.<br>Seluruh data saat ini akan <b>diganti</b>, termasuk di perangkat lain yang tersinkron. Disarankan export JSON terlebih dahulu.'
    });
    if (!ok) return;
    ['members', 'divisions', 'meetings', 'attendance', 'englishDayScores', 'announcements'].forEach(k => { S[k] = d[k]; });
    const ds = defaultSettings();
    S.settings = Object.assign(ds, d.settings);
    S.settings.custom = Object.assign(defaultSettings().custom, d.settings.custom || {});
    if (!Array.isArray(S.settings.edConfig) || !S.settings.edConfig.length) S.settings.edConfig = defaultSettings().edConfig;
    if (!THEMES[S.settings.theme] && S.settings.theme !== 'custom') S.settings.theme = 'navy';
    persistAll(); resetUIState(); applyTheme(); rerender(); toast('Data berhasil diimport.');
  };
  fr.readAsText(f);
};
function resetUIState() {
  Object.assign(UI.members, { q: '', div: 'all', sort: 'asc' });
  Object.assign(UI.meetings, { q: '', div: 'all', sort: 'desc' });
  UI.att = { div: '', meeting: '' };

}

    '<div class="modal-foot" style="padding:14px 0 0;border:0"><button class="btn ghost" type="button" data-modal-close>Batal</button><button class="btn danger" type="submit">Reset sekarang</button></div></form>'
});

/* ---------- Data demo ---------- */
function mulberry(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function shiftDate(days) { const d = new Date(); d.setDate(d.getDate() + days); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
A.loadDemo = async () => {
  if (!S.divisions.length) { toast('Buat divisi terlebih dahulu.', 'error'); return; }
  const ok = await confirmDialog({ title: 'Muat data demo?', message: 'Sistem akan menambahkan anggota, pertemuan, absensi, penilaian, dan pengumuman contoh. Semuanya ditandai <b>DEMO</b> dan dapat dihapus kapan saja di Settings. Data asli Anda tidak diubah.', confirmText: 'Muat data demo' });
  if (!ok) return;
  const rnd = mulberry(20261115);
  const names = ['Aulia Rahma', 'Bima Pratama', 'Citra Lestari', 'Dimas Saputra', 'Eka Wulandari', 'Fajar Nugroho', 'Gita Permata', 'Hafiz Ramadhan', 'Intan Maharani', 'Joko Santoso', 'Kirana Putri', 'Lukman Hakim', 'Maya Anggraini', 'Naufal Akbar', 'Olivia Sari', 'Putra Wijaya', 'Qonita Zahra', 'Rizky Maulana', 'Salsabila Nur', 'Tegar Prasetyo'];
  const titles = ['Weekly Discussion', 'English Speaking Practice', 'Debate Training', 'Monthly Evaluation'];
  const demoMembers = [];
  names.forEach((n, i) => {
    if (S.members.some(m => normName(m.name) === normName(n))) return;
    const m = { id: uid('mem'), code: nextMemberCode(), name: n, divisionId: S.divisions[i % S.divisions.length].id, joinDate: shiftDate(-120), createdAt: new Date().toISOString(), demo: true };
    S.members.push(m); demoMembers.push(m);
  });
  S.divisions.forEach((d, di) => {
    for (let k = 0; k < 4; k++) {
      const date = shiftDate(-28 + 7 * k - di);
      const meet = { id: uid('meet'), divisionId: d.id, title: titles[k], date: date, createdAt: new Date().toISOString(), demo: true };
      S.meetings.push(meet);
      S.attendance[meet.id] = {};
      demoMembers.filter(m => m.divisionId === d.id).forEach(m => {
        const x = rnd(), st = x < 0.68 ? 'hadir' : x < 0.78 ? 'izin' : x < 0.86 ? 'sakit' : 'alfa';
        S.attendance[meet.id][m.id] = { status: st, note: '', updatedAt: new Date(date + 'T10:00:00').toISOString() };
      });
    }
  });
  const now = new Date(), per = now.getFullYear() + '-' + pad(now.getMonth() + 1);
  demoMembers.slice(0, 8).forEach(m => {
    const scores = {}; S.settings.edConfig.forEach(c => { scores[c.key] = 70 + Math.floor(rnd() * 28); });
    S.englishDayScores.push({ id: uid('ed'), name: m.name, divisionId: m.divisionId, period: per, scores: scores, memberId: m.id, createdAt: new Date().toISOString(), demo: true });
  });
  S.announcements.push({ id: uid('ann'), title: 'Contoh pengumuman', body: 'Ini pengumuman contoh. Hapus lewat Settings > Hapus data demo.', date: todayStr(), demo: true });
  persistAll(); toast('Data demo dimuat.'); rerender();
};
A.delDemo = async () => {
  const c = demoCounts();
  const ok = await confirmDialog({ title: 'Hapus data demo?', danger: true, confirmText: 'Hapus data demo', message: 'Akan dihapus: <b>' + c.members + '</b> anggota demo, <b>' + c.meetings + '</b> pertemuan demo (beserta absensinya), <b>' + c.scores + '</b> penilaian, dan <b>' + c.anns + '</b> pengumuman demo. Data asli tidak ikut terhapus.' });
  if (!ok) return;
  const gone = new Set(S.members.filter(m => m.demo).map(m => m.id));
  S.meetings.filter(m => m.demo).forEach(m => { delete S.attendance[m.id]; });
  S.members = S.members.filter(m => !m.demo);
  S.meetings = S.meetings.filter(m => !m.demo);
  Object.keys(S.attendance).forEach(mid => gone.forEach(id => { delete S.attendance[mid][id]; }));
  S.englishDayScores = S.englishDayScores.filter(s => !s.demo);
  S.announcements = S.announcements.filter(a => !a.demo);
  persistAll(); resetUIState(); toast('Data demo dihapus.'); rerender();
};

/* =====================================================================
   SINKRONISASI ONLINE (Firebase Realtime Database)
   Tiap kumpulan data disimpan sebagai satu teks JSON di aspire/<nama>.
   Local Storage tetap dipakai sebagai salinan lokal dan cadangan.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyA9Nn1O9vU6n1Sn65yv5Wb-NziIwKvsI9s',
  authDomain: 'absen-pertemuan-divisi.firebaseapp.com',
  databaseURL: 'https://absen-pertemuan-divisi-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId: 'absen-pertemuan-divisi',
  storageBucket: 'absen-pertemuan-divisi.firebasestorage.app',
  messagingSenderId: '715530893330',
  appId: '1:715530893330:web:883009ec700f4f4c7b40cb'
};
const CLOUD_KEYS = ['members', 'divisions', 'meetings', 'attendance', 'englishDayScores', 'announcements', 'settings'];
const cloud = { db: null, status: 'local', last: {}, timers: {}, got: {}, dirty: {}, pending: false };
const SYNC_TEXT = { local: 'Lokal saja', connecting: 'Menyambung…', online: 'Tersinkron', offline: 'Offline', error: 'Gagal sinkron' };
function setSync(status, msg) {
  cloud.status = status;
  $$('.sync').forEach(el => { el.textContent = '● ' + SYNC_TEXT[status]; el.dataset.s = status; el.title = msg || ''; });
}
function cloudInit() {
  if (typeof firebase === 'undefined') { setSync('local', 'Firebase tidak termuat (offline?). Data hanya tersimpan di browser ini.'); return; }
  try {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    cloud.db = firebase.database();
    setSync('connecting');
    cloud.db.ref('.info/connected').on('value', snap => {
      if (snap.val() === true) { if (cloud.status !== 'error') setSync('online'); }
      else if (cloud.status !== 'connecting') setSync('offline', 'Perubahan akan dikirim saat kembali online.');
    });
    CLOUD_KEYS.forEach(k => {
      cloud.db.ref('aspire/' + k).on('value', snap => onRemote(k, snap), () => {
        setSync('error', 'Akses database ditolak. Periksa Rules di Realtime Database.');
        toast('Sinkronisasi ditolak. Periksa Rules di Firebase Realtime Database.', 'error', 7000);
      });
    });
  } catch (e) { setSync('error', 'Firebase gagal dimulai: ' + e.message); }
}
function cloudQueue(k) {
  if (!cloud.db || CLOUD_KEYS.indexOf(k) < 0) return;
  clearTimeout(cloud.timers[k]);
  cloud.timers[k] = setTimeout(() => cloudPush(k), 500);
}
function cloudPush(k) {
  if (!cloud.db) return;
  if (!cloud.got[k]) { cloud.dirty[k] = true; return; }
  const str = JSON.stringify(S[k]);
  if (str === cloud.last[k]) return;
  cloud.last[k] = str;
  cloud.db.ref('aspire/' + k).set(str).catch(e => { cloud.last[k] = null; setSync('error', 'Gagal mengirim data: ' + e.message); });
}
function applyRemote(k, val) {
  if (['members', 'divisions', 'meetings', 'englishDayScores', 'announcements'].indexOf(k) >= 0) {
    if (!Array.isArray(val)) return false;
    S[k] = val; return true;
  }
  if (k === 'attendance') {
    if (!val || typeof val !== 'object' || Array.isArray(val)) return false;
    S[k] = val; return true;
  }
  if (k === 'settings') {
    if (!val || typeof val !== 'object') return false;
    const n = Object.assign(defaultSettings(), val);
    n.custom = Object.assign(defaultSettings().custom, val.custom || {});
    if (!Array.isArray(n.edConfig) || !n.edConfig.length) n.edConfig = defaultSettings().edConfig;
    if (!THEMES[n.theme] && n.theme !== 'custom') n.theme = 'navy';
    S.settings = n; applyTheme(); return true;
  }
  return false;
}
function onRemote(k, snap) {
  const v = snap.val(), first = !cloud.got[k];
  cloud.got[k] = true;
  if (typeof v !== 'string') { cloudPush(k); return; }          // database masih kosong: unggah data lokal
  if (v === cloud.last[k]) return;                              // gema dari kiriman kita sendiri
  if (first && cloud.dirty[k]) { cloudPush(k); return; }        // ada perubahan lokal sebelum tersambung
  if (JSON.stringify(S[k]) === v) { cloud.last[k] = v; return; }
  let parsed;
  try { parsed = JSON.parse(v); } catch (e) { return; }
  if (!applyRemote(k, parsed)) return;
  cloud.last[k] = v;
  try { localStorage.setItem(PREFIX + k, JSON.stringify(S[k])); } catch (e) {}
  cloud.pending = true; tryRefresh();
}
/* Tampilan diperbarui otomatis, tetapi tidak saat admin sedang mengetik atau membuka dialog. */
function tryRefresh() {
  if (!cloud.pending) return;
  const a = document.activeElement;
  const typing = a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && a.closest('#page,.modal-back');
  if (modals.length || typing) return;
  cloud.pending = false;
  rerender();
}
setInterval(tryRefresh, 1500);
